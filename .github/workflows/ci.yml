# Correctness gate for main: the Python suite and the frontend checks.
#
# Both jobs run on every pull request and on every push to main.
#
# Building the Docker image lives in docker.yml, not here.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A second push to a PR cancels the run still in flight for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/*.txt

      # Order matters. base.txt pulls ultralytics, which declares torch without
      # an index, so pip would resolve it from PyPI and drag in ~2.5 GB of CUDA
      # wheels to run a ten-second suite. Installing the CPU build first from
      # PyTorch's cpu index means the later resolve finds torch already
      # satisfied.
      - name: Install CPU torch
        run: pip install -r requirements/torch-cpu.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      # Ultralytics pulls in opencv-python, a separate distribution from the headless
      # build pinned in base.txt, and the GUI one wins at import time. Its version is
      # unpinned and arrives transitively, and it needs libGL, which a runner
      # image is not obliged to ship. Removing it leaves the pinned headless
      # build as the only cv2, matching what the image actually runs.
      - name: Drop the GUI opencv build
        run: |
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps \
            "$(grep '^opencv-python-headless==' requirements/base.txt)"

      - name: Run tests
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
