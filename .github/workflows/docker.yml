# Verifies that the image still builds. Runs after a merge to main, NOT on
# pull requests, and is deliberately not a required status check.
#
# Why post-merge rather than a PR gate: the pip layers are the slow ones and
# they do not cache between GitHub-hosted runners without extra setup, so
# gating PRs on this would add roughly eight minutes to every PR to re-verify
# the file that changes least.
#
# Only the cpu target is built. jetson is aarch64/L4T and cannot build on a
# GitHub-hosted x86 runner; gpu builds fine but pulls cu124 wheels for no
# signal this job does not already have.

name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the cpu image
        run: docker compose build cpu
